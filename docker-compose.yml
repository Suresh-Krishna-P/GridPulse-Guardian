version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  simulator:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "services/simulator/main.py"]
    environment:
      - REDIS_HOST=redis
      - TICK_RATE_MS=1000

  ingestion:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "services/ingestion/main.py"]
    environment:
      - REDIS_HOST=redis
    volumes:
      - "./sim datasets:/app/sim datasets:ro"

  demand:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "agents/demand/main.py"]
    environment:
      - REDIS_HOST=redis

  supply:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "agents/supply/main.py"]
    environment:
      - REDIS_HOST=redis

  market:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "agents/market/main.py"]
    environment:
      - REDIS_HOST=redis

  safety:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "agents/safety/main.py"]
    environment:
      - REDIS_HOST=redis

  api:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=gridpulse
      - POSTGRES_PASSWORD=gridpulse
      - POSTGRES_DB=gridpulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  settlement:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "agents/settlement/main.py"]
    environment:
      - REDIS_HOST=redis
      - DB_USER=gridpulse
      - DB_PASS=gridpulse
      - DB_HOST=postgres
      - DB_NAME=gridpulse

  pricing:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "agents/pricing/main.py"]
    environment:
      - REDIS_HOST=redis

  explainability:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "agents/explainability/main.py"]
    environment:
      - REDIS_HOST=redis
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  federated:
    build: 
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "agents/federated/main.py"]
    environment:
      - REDIS_HOST=redis
